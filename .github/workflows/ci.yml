name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Orca
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo stablyai/orca --pattern 'orca-ide_*_amd64.deb' --output "$RUNNER_TEMP/orca.deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "$RUNNER_TEMP/orca.deb"

      - run: orca-ide plugin test .
      - run: orca-ide plugin check .

      - name: Check a new version has release notes
        run: |
          version=$(jq -r .version orca-plugin.json)
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null && [ ! -f ".github/release-notes/$version.md" ]; then
            echo "::error::Version $version needs .github/release-notes/$version.md"
            exit 1
          fi
